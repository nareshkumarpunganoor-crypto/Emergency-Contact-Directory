<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🚨 Emergency Contact Directory</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="header-content">
        <h1>🚨 Emergency Contact Directory</h1>
        <p>Keep your important contacts safe and accessible</p>
      </div>
    </header>

    <div class="container">
      <!-- Notification -->
      <div id="notification" class="notification hidden"></div>

      <!-- Add / Edit Contact Form -->
      <section class="form-section">
        <h2 id="form-title">➕ Add New Contact</h2>
        <form id="contact-form">
          <input type="hidden" id="contact-id" />

          <div class="form-grid">
            <div class="form-group">
              <label for="name">Full Name *</label>
              <input
                type="text"
                id="name"
                placeholder="e.g., John Doe"
                required
              />
            </div>

            <div class="form-group">
              <label for="phone">Phone Number *</label>
              <input
                type="tel"
                id="phone"
                placeholder="e.g., +1 234 567 8900"
                required
              />
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                placeholder="e.g., john@example.com"
              />
            </div>

            <div class="form-group">
              <label for="relationship">Category *</label>
              <select id="relationship" required>
                <option value="">Select Category</option>
                <option value="Family">👨‍👩‍👧‍👦 Family</option>
                <option value="Friend">🤝 Friend</option>
                <option value="Doctor">🏥 Doctor</option>
                <option value="Police">👮 Police</option>
                <option value="Fire Department">🚒 Fire Department</option>
                <option value="Ambulance">🚑 Ambulance</option>
                <option value="Neighbor">🏠 Neighbor</option>
                <option value="Workplace">💼 Workplace</option>
                <option value="Other">📋 Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="priority">Priority *</label>
              <select id="priority" required>
                <option value="High">🔴 High</option>
                <option value="Medium" selected>🟡 Medium</option>
                <option value="Low">🟢 Low</option>
              </select>
            </div>

            <div class="form-group">
              <label for="address">Address</label>
              <input
                type="text"
                id="address"
                placeholder="e.g., 123 Main St, City"
              />
            </div>
          </div>

          <div class="form-group full-width">
            <label for="notes">Notes</label>
            <textarea
              id="notes"
              placeholder="Any additional information..."
              rows="3"
            ></textarea>
          </div>

          <div class="form-buttons">
            <button type="submit" class="btn btn-primary" id="submit-btn">
              ➕ Add Contact
            </button>
            <button
              type="button"
              class="btn btn-secondary hidden"
              id="cancel-btn"
            >
              ✖ Cancel
            </button>
          </div>
        </form>
      </section>

      <!-- Search and Filter -->
      <section class="filter-section">
        <h2>🔍 Search & Filter</h2>
        <div class="filter-grid">
          <input
            type="text"
            id="search-input"
            placeholder="Search by name or phone..."
          />
          <select id="filter-relationship">
            <option value="">All Categories</option>
            <option value="Family">👨‍👩‍👧‍👦 Family</option>
            <option value="Friend">🤝 Friend</option>
            <option value="Doctor">🏥 Doctor</option>
            <option value="Police">👮 Police</option>
            <option value="Fire Department">🚒 Fire Department</option>
            <option value="Ambulance">🚑 Ambulance</option>
            <option value="Neighbor">🏠 Neighbor</option>
            <option value="Workplace">💼 Workplace</option>
            <option value="Other">📋 Other</option>
          </select>
          <select id="filter-priority">
            <option value="">All Priorities</option>
            <option value="High">🔴 High</option>
            <option value="Medium">🟡 Medium</option>
            <option value="Low">🟢 Low</option>
          </select>
        </div>
      </section>

      <!-- Contacts List -->
      <section class="contacts-section">
        <div class="contacts-header">
          <h2>📞 Contact List</h2>
          <span id="contact-count" class="contact-count">0 contacts</span>
        </div>

        <div id="loading" class="loading">Loading contacts...</div>

        <div id="contacts-list" class="contacts-grid"></div>

        <div id="no-contacts" class="no-contacts hidden">
          <p>📭 No contacts found. Add your first emergency contact above!</p>
        </div>
      </section>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal hidden">
      <div class="modal-content">
        <h3>⚠️ Confirm Delete</h3>
        <p>Are you sure you want to delete this contact?</p>
        <p id="delete-contact-name" class="delete-name"></p>
        <div class="modal-buttons">
          <button class="btn btn-danger" id="confirm-delete">🗑 Delete</button>
          <button class="btn btn-secondary" id="cancel-delete">
            ✖ Cancel
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
